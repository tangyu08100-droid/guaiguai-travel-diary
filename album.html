<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="按拍摄时间整理的旅行照片。">
  <meta name="theme-color" content="#0d1428">
  <title>相册 · 拐拐的流浪日记</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="archive.css">
  <script defer src="data.js"></script>
  <script defer src="archive.js"></script>
  <script defer src="album-notes.js"></script>
  <script defer src="album.js"></script>
</head>
<body class="page-album">
  <div class="progress" id="progress" aria-hidden="true"></div>
  <header class="nav" id="nav">
    <a class="brand" href="index.html" data-site-title>拐拐的流浪日记</a>
    <nav class="nav-links" aria-label="相册导航">
      <a href="#works">照片</a>
      <a href="#about">其他相册</a>
      <a class="nav-home" href="index.html#trips">全部相册</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="top">
      <img class="hero-img" id="heroImg" alt="" fetchpriority="high">
      <div class="hero-veil"></div>
      <div class="hero-copy">
        <p class="eyebrow" id="heroEyebrow">PHOTO ALBUM</p>
        <h1 id="heroTitle"></h1>
        <p class="sub" id="heroSub"></p>
        <a class="hero-action" id="heroAction" href="#works">查看照片</a>
      </div>
      <div class="hero-foot"><div class="hero-facts" id="heroFacts"></div></div>
    </section>

    <section class="works section" id="works">
      <section class="album-note" id="albumNote" aria-labelledby="albumNoteTitle" hidden>
        <h2 id="albumNoteTitle">流浪手记</h2>
        <p id="albumNoteText"></p>
      </section>
      <header class="section-head">
        <div class="sh-left"><span class="sec-en">PHOTOGRAPHS</span></div>
        <div class="sh-right">
          <h2>相册照片</h2>
          <p class="lead" id="worksLead"></p>
        </div>
      </header>
      <div class="filters" id="filters" aria-label="按日期筛选" hidden></div>
      <div class="grid" id="grid" hidden></div>
      <div class="inline-gallery" id="inlineGallery" hidden></div>
    </section>

    <section class="section sec-about" id="about">
      <header class="section-head">
        <div class="sh-left"><span class="sec-en">MORE ALBUMS</span></div>
        <div class="sh-right"><h2>其他相册</h2></div>
      </header>
      <div class="others-row" id="others"></div>
      <footer class="colophon">
        <div class="co-item"><b data-site-title>拐拐的流浪日记</b><span id="coLine"></span></div>
        <a class="to-top" href="index.html#trips">浏览全部相册</a>
      </footer>
    </section>
  </main>

  <dialog class="detail" id="detail" aria-labelledby="detailTitle">
    <div class="detail-bar">
      <button class="detail-back" id="detailBack" type="button" autofocus>返回相册</button>
      <span class="detail-title" id="detailTitle"></span>
      <button class="detail-x" id="detailX" type="button" aria-label="关闭照片分组">×</button>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </dialog>

  <dialog class="lb" id="lb" aria-label="照片大图">
    <button class="lb-x" id="lbX" type="button" aria-label="关闭大图" autofocus>×</button>
    <button class="lb-prev" id="lbPrev" type="button">上一张</button>
    <div class="lb-stage"><img class="lb-img" id="lbImg" alt=""></div>
    <button class="lb-next" id="lbNext" type="button">下一张</button>
    <div class="lb-bar" aria-live="polite"><span id="lbCap"></span><span id="lbCount"></span></div>
  </dialog>
  <noscript>请启用 JavaScript 浏览相册。</noscript>
</body>
</html>
